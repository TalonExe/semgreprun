name: Semgrep

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run Semgrep
        run: semgrep scan --config p/default --metrics=off --error .
